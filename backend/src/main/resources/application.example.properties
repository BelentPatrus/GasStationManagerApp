# ============================================================
#  Spring Boot config TEMPLATE (no secrets)
#  Copy to: src/main/resources/application-local.properties
#  and fill in real values. Do NOT commit the real file.
#  You can run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#                     # or: java -jar target/app.jar --spring.profiles.active=local
# ============================================================

# ---- App ----
spring.application.name=GasStationManagerApp
server.port=8080

# The profile you usually run locally
spring.profiles.active=local

# ---- Datasource (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/gasstation
spring.datasource.username=CHANGE_ME
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari (connection pool) ? adjust if needed
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---- JPA / Hibernate ----
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Logging (tune as you like) ----
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

